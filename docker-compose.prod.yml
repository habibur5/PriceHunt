services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro

  api:
    image: pricehunt-api:latest
    restart: unless-stopped
    env_file:
      - .env.production

  web:
    image: pricehunt-web:latest
    restart: unless-stopped
    env_file:
      - .env.production

  admin:
    image: pricehunt-admin:latest
    restart: unless-stopped
    env_file:
      - .env.production
